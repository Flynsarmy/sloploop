name: Release on Version Bump

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if version was incremented
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(jq -r '.version' package.json)"
          BEFORE_SHA="${{ github.event.before }}"
          EMPTY_SHA="0000000000000000000000000000000000000000"

          PREVIOUS_VERSION=""
          if [[ "$BEFORE_SHA" != "$EMPTY_SHA" ]] && git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "$BEFORE_SHA:package.json" | jq -r '.version')"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          SHOULD_RELEASE="$(PREVIOUS_VERSION="$PREVIOUS_VERSION" CURRENT_VERSION="$CURRENT_VERSION" node <<'NODE'
          function parseSemver(v) {
            if (!v) return null;
            const m = String(v).trim().match(/^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$/);
            if (!m) return null;
            return {
              major: Number(m[1]),
              minor: Number(m[2]),
              patch: Number(m[3]),
              prerelease: m[4] ? m[4].split('.') : []
            };
          }

          function compareIdentifiers(a, b) {
            const aNum = /^\d+$/.test(a);
            const bNum = /^\d+$/.test(b);

            if (aNum && bNum) return Number(a) - Number(b);
            if (aNum && !bNum) return -1;
            if (!aNum && bNum) return 1;
            return a < b ? -1 : (a > b ? 1 : 0);
          }

          function compareSemver(a, b) {
            if (a.major !== b.major) return a.major - b.major;
            if (a.minor !== b.minor) return a.minor - b.minor;
            if (a.patch !== b.patch) return a.patch - b.patch;

            const aPre = a.prerelease;
            const bPre = b.prerelease;

            if (aPre.length === 0 && bPre.length === 0) return 0;
            if (aPre.length === 0) return 1;
            if (bPre.length === 0) return -1;

            const len = Math.max(aPre.length, bPre.length);
            for (let i = 0; i < len; i += 1) {
              if (aPre[i] === undefined) return -1;
              if (bPre[i] === undefined) return 1;
              const cmp = compareIdentifiers(aPre[i], bPre[i]);
              if (cmp !== 0) return cmp;
            }
            return 0;
          }

          const prevRaw = process.env.PREVIOUS_VERSION || '';
          const curRaw = process.env.CURRENT_VERSION || '';
          const prev = parseSemver(prevRaw);
          const cur = parseSemver(curRaw);

          if (!prev || !cur) {
            process.stdout.write('false');
            process.exit(0);
          }

          process.stdout.write(compareSemver(cur, prev) > 0 ? 'true' : 'false');
          NODE
          )"

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Log version comparison
        run: |
          echo "Previous version: ${{ steps.version_check.outputs.previous_version }}"
          echo "Current version:  ${{ steps.version_check.outputs.current_version }}"
          echo "Release needed:   ${{ steps.version_check.outputs.should_release }}"

      - name: Set up Bun
        if: steps.version_check.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.version_check.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Build web app
        if: steps.version_check.outputs.should_release == 'true'
        run: bun run build

      - name: Package build output
        if: steps.version_check.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version_check.outputs.current_version }}"
          ASSET_NAME="sloploop-webapp-v${VERSION}.tar.gz"
          tar -czf "$ASSET_NAME" -C dist .
          echo "asset_path=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.current_version }}
          name: v${{ steps.version_check.outputs.current_version }}
          files: ${{ steps.package.outputs.asset_path }}
          generate_release_notes: true
